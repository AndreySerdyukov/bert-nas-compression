server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Load-bearing for the progress stream. With buffering on, nginx holds the whole
        # server-sent-event response and hands it over at the end, so a two-minute evaluation
        # shows no progress at all and then completes instantly. It does not reproduce in
        # development, because Vite's proxy streams - only the Docker stack shows it, which is
        # why CI starts a `selftest` job and asserts the first frame arrives within seconds.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        # SSE is HTTP/1.1 chunked; the default 1.0 upstream would close between frames.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
