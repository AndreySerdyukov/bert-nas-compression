<!-- The mark at tab size. Same four bars, thicker and with more air between them, because at 16px
     the hairline outlines of the full mark close up into solid blocks.

     Two palettes rather than one: `prefers-color-scheme` swaps the outlined pair, which would
     otherwise be invisible against a dark browser chrome. The filled pair stays the accent blue in
     both, since that is the colour a kept layer has everywhere else in the app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .kept { fill: #0f62fe; }
    .dropped { fill: none; stroke: #18181b; stroke-width: 2.4; }
    @media (prefers-color-scheme: dark) {
      .kept { fill: #78a9ff; }
      .dropped { stroke: #eaebee; }
    }
  </style>
  <rect class="kept" x="5" y="4" width="22" height="5" rx="1.8" />
  <rect class="kept" x="5" y="11.5" width="22" height="5" rx="1.8" />
  <rect class="dropped" x="6.2" y="20.2" width="19.6" height="3.8" rx="1.5" />
  <rect class="dropped" x="6.2" y="26.2" width="19.6" height="3.8" rx="1.5" />
</svg>
