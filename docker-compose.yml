# Local run of the whole app: backend (FastAPI) + frontend (nginx serving the built bundle).
services:
  backend:
    build: ./backend
    environment:
      APP_CORS_ORIGINS: '["http://localhost:3000"]'
      # Override to "none" to exercise the no-weights path the image ships with, or to "all" for
      # the two extra full-BERT runs.
      APP_MODEL_TIER: ${APP_MODEL_TIER:-core}
    ports:
      - "8000:8000"
    # The image bakes in whatever `backend/models/` held at build time - nothing on a clean clone,
    # a gigabyte on a machine that has run the fetch script. Uncomment to mount the checkpoints
    # instead of copying them, which keeps the image small and lets `fetch_models.py` update them
    # without a rebuild. Read-only: nothing at serve time has any business writing there.
    # volumes:
    #   - ./backend/models:/app/models:ro

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
